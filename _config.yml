# ================================
# Basic Site Settings
# ================================
locale: "en-US"
title: "Fida Ur Rahman"
title_separator: "-"
name: &name "Fida Ur Rahman"
description: &description "Software Engineer"

url: "https://fidaarahman.github.io"
baseurl: ""

repository: "fidaarahman/fidaarahman.github.io"

# ================================
# Author (Sidebar Profile)
# ================================
author:
  avatar: "/images/profile.png"
  name: "Fida Ur Rahman"
  bio: "Software Engineering graduate with experience in AI, Deep Learning, Computer Vision, and Android development."
  location: "Islamabad, Pakistan"
  employer: "AI Engineer"
  email: "fidaurrahman700@gmail.com"

  # Academic profiles
  googlescholar:
  researchgate:
  orcid:

  # Code & Dev
  github: "fidaarahman"
  kaggle:
  stackoverflow:

  # Social
  linkedin: "fidarh24"

# ================================
# Publication Categories
# ================================
publication_category:
  journal:
    title: "Journal Articles"
  manuscripts:
    title: "Manuscripts"
  conferences:
    title: "Conference Papers"

# ================================
# Site Behavior
# ================================
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false

# ================================
# SEO (optional)
# ================================
google_site_verification:
bing_site_verification:
yandex_site_verification:

# ================================
# Analytics (disabled for now)
# ================================
analytics:
  provider: false

# ================================
# Files & Build
# ================================
include:
  - .htaccess
  - _pages
  - files

exclude:
  - .github
  - node_modules
  - vendor
  - README
  - Gemfile
  - Gemfile.lock

encoding: "utf-8"

# ================================
# Markdown
# ================================
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"

# ================================
# Collections
# ================================
collections:
  publications:
    output: true
    permalink: /publications/:path/
  portfolio:
    output: true
    permalink: /portfolio/:path/
  talks:
    output: true
    permalink: /talks/:path/

# ================================
# Defaults
# ================================
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# ================================
# Sass / CSS
# ================================
sass:
  sass_dir: _sass
  style: compressed

# ================================
# Output
# ================================
permalink: /:categories/:title/
timezone: Etc/UTC

# ================================
# Plugins (GitHub Pages supported)
# ================================
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-sitemap
  - jemoji
